name: Unzip uploaded images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip any zip files into the repo root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "no zips"; exit 0; fi
          for z in "${zips[@]}"; do unzip -o -j "$z" '*.jpg' -d . ; git rm -q "$z"; done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unzip uploaded images" || exit 0
          git push
